name: Release

permissions:
  contents: write

on:
    workflow_dispatch:
    push:
        branches:
            - 'main'
            - 'dev'
        tags:
            - 'v*.*.*'

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    container:
        image: archlinux:latest
    steps:
      - name: set git global safe directory
        run: |
          pacman -Syu git npm tree zip unzip upx --noconfirm
          git config --global --add safe.directory $(realpath .)

      - uses: actions/checkout@v5

      # - name: submodules
      #   run: |
      #     git submodule update --init --recursive py_modules

      # - name: change log level
      #   run: |
      #     sed -i 's/logging.DEBUG/logging.INFO/' py_modules/config.py

      - name: build plugin
        run: |
          npm i -g pnpm
          pnpm config set registry https://registry.npmmirror.com/
          pnpm install --no-frozen-lockfile
          pnpm update @decky/ui --latest
          pnpm update @decky/api --latest
          npm run package
      
      - name: show and verify files
        run: |
          tar -tzvf MangoPeel-Neo.tar.gz
          unzip -l MangoPeel-Neo.zip
          tar -tzf MangoPeel-Neo.tar.gz | grep -qx 'mangopeel_neo/dist/index.js'
          unzip -Z1 MangoPeel-Neo.zip | grep -qx 'mangopeel_neo/dist/index.js'
          if unzip -Z1 MangoPeel-Neo.zip | grep -q '\.js\.map$'; then
            echo 'Source maps must not be included in the release package.' >&2
            exit 1
          fi

      - name: Publish Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MangoPeel-Neo
          path: |
            MangoPeel-Neo.tar.gz
            MangoPeel-Neo.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - run: mkdir /tmp/artifacts

      - name: download artifact
        uses: actions/download-artifact@v5
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: publish to github release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            /tmp/artifacts/MangoPeel-Neo/MangoPeel-Neo.tar.gz
            /tmp/artifacts/MangoPeel-Neo/MangoPeel-Neo.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: contains(github.ref, 'pre') || contains(github.ref, '.rc')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}